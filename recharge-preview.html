<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>充值与订阅 | Sub2API</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b24;
      --panel-soft: #111720;
      --line: #283241;
      --text: #f2f5f8;
      --muted: #93a0af;
      --accent: #50c8e8;
      --accent-soft: rgba(80, 200, 232, .12);
      --success: #80d6a2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 42px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .intro {
      max-width: 620px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      padding: 8px 12px;
      border: 1px solid rgba(128, 214, 162, .28);
      border-radius: 6px;
      color: var(--success);
      background: rgba(128, 214, 162, .08);
      font-size: 13px;
      white-space: nowrap;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .notice {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
      margin-bottom: 28px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      background: var(--panel-soft);
    }

    .notice-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(80, 200, 232, .45);
      border-radius: 50%;
      color: var(--accent);
      font-weight: 700;
    }

    .notice strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    .notice span { color: var(--muted); }

    .contacts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .contact {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .contact-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 88px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }

    .contact-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .contact-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 6px;
      color: #071116;
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .contact h2 {
      margin-bottom: 1px;
      font-size: 18px;
      line-height: 1.25;
    }

    .account {
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy {
      flex: 0 0 auto;
      border: 1px solid #3a4a5e;
      border-radius: 5px;
      padding: 7px 11px;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .copy:hover { border-color: var(--accent); color: var(--accent); }
    .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .qr-wrap {
      display: grid;
      min-height: 440px;
      place-items: center;
      padding: 24px;
      background: #0b1016;
    }

    .qr {
      display: block;
      width: min(100%, 360px);
      height: auto;
      max-height: 540px;
      object-fit: contain;
      border-radius: 4px;
    }

    .contact-foot {
      padding: 14px 22px 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      color: #687687;
      font-size: 12px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      transform: translateY(12px);
      padding: 10px 14px;
      border: 1px solid rgba(128, 214, 162, .35);
      border-radius: 5px;
      color: var(--success);
      background: #17251e;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 34px; }
      .topbar { display: block; margin-bottom: 30px; }
      .status { margin-top: 18px; }
      .contacts { grid-template-columns: 1fr; }
      .qr-wrap { min-height: 0; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 20px); }
      .contact-head { padding: 16px; }
      .contact-foot { padding-inline: 16px; }
      .qr-wrap { padding: 14px; }
      .notice { padding: 15px; }
      .copy { padding-inline: 9px; }
    }
  </style>
  <style>
    /* Final preview adjustments: both contact cards share one visual system. */
    .contact:nth-child(2) { direction: ltr; }
    .contact:nth-child(2) > * { direction: ltr; }
    .contact-head,
    .contact:nth-child(2) .contact-head { grid-column: 1; grid-row: 1; }
    .qr-wrap,
    .contact:nth-child(2) .qr-wrap { grid-column: 2; grid-row: 1 / span 2; background: #edf3fa; }
    .contact-foot,
    .contact:nth-child(2) .contact-foot { grid-column: 1; grid-row: 2; }
    .contact:nth-child(2) .contact-icon { background: var(--qq); }
    .contact:nth-child(2) .copy { color: var(--qq); }
  </style>
  <style>
    :root {
      --bg: #f7f4ef;
      --panel: #fffdf9;
      --ink: #18231f;
      --muted: #66716b;
      --qq: #287be7;
      --wechat: #18a95d;
    }

    body { background: var(--bg); color: var(--ink); }
    .shell { width: min(1000px, calc(100% - 40px)); padding: 70px 0 64px; }
    .topbar { display: block; margin: 0 auto 42px; text-align: center; }
    .eyebrow { color: #d16841; letter-spacing: .14em; }
    h1 { margin-bottom: 15px; font-size: clamp(40px, 6vw, 64px); letter-spacing: 0; }
    .intro { max-width: 560px; margin: 0 auto; color: var(--muted); font-size: 17px; }
    .status, .notice { display: none; }
    .contacts { gap: 26px; }
    .contact {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(280px, 1.08fr);
      min-height: 510px;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      box-shadow: 0 16px 42px rgba(70, 54, 40, .1);
    }
    .contact-head { grid-column: 1; grid-row: 1; }
    .qr-wrap { grid-column: 2; grid-row: 1 / span 2; }
    .contact-head {
      display: block;
      min-height: 0;
      padding: 54px 42px 20px;
      border: 0;
      background: #fffdf9;
    }
    .contact-title { display: block; }
    .contact-icon {
      width: auto;
      height: auto;
      display: inline-block;
      margin-bottom: 22px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--qq);
      font-size: 12px;
      letter-spacing: .08em;
    }
    .contact:nth-child(2) .contact-icon { background: var(--wechat); }
    .contact h2 { margin-bottom: 12px; font-size: clamp(28px, 3vw, 38px); }
    .account { color: var(--ink); font-family: "SFMono-Regular", Consolas, monospace; font-size: 17px; }
    .copy { margin-top: 35px; border: 0; border-radius: 0; padding: 10px 0; color: var(--qq); background: transparent; font-weight: 700; }
    .copy::after { margin-left: 7px; content: "↗"; }
    .contact:nth-child(2) .copy { color: var(--wechat); }
    .copy:hover { border: 0; color: var(--ink); background: transparent; }
    .qr-wrap { min-height: 0; padding: 34px; background: #edf3fa; }
    .contact:nth-child(2) .qr-wrap { background: #edf8f1; }
    .qr { width: min(100%, 355px); max-height: 440px; border: 0; border-radius: 0; box-shadow: none; }
    .contact-foot { grid-column: 1; grid-row: 2; padding: 0 42px 48px; color: var(--muted); background: #fffdf9; }
    .contact:nth-child(2) .contact-head { grid-column: 2; }
    .contact:nth-child(2) .qr-wrap { grid-column: 1; }
    .contact:nth-child(2) .contact-foot { grid-column: 2; }
    .footer { margin-top: 36px; color: #8b8279; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 46px; }
      .topbar { margin-bottom: 30px; }
      h1 { font-size: 42px; }
      .contacts { grid-template-columns: 1fr; }
      .contact, .contact:nth-child(2) { display: flex; flex-direction: column; }
      .contact-head { padding: 34px 28px 12px; }
      .qr-wrap { order: 2; padding: 22px; }
      .contact-foot, .contact:nth-child(2) .contact-foot { order: 3; padding: 18px 28px 30px; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 20px); }
      h1 { font-size: 36px; }
      .contact-head { padding-inline: 22px; }
      .contact-foot, .contact:nth-child(2) .contact-foot { padding-inline: 22px; }
    }
  </style>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;

    }

      color: #55636f;
      font-size: 17px;

    }

    }

    .contact-icon {
      width: 40px;

      border-radius: 10px;
      color: #fff;
      background: var(--accent);

    }

    .contact h2 { font-size: 19px; }

    }

    .copy:hover { border-color: var(--accent); color: var(--accent); background: #f4fbfb; }

      box-shadow: 0 8px 24px rgba(32, 48, 61, .1);
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 38px; }
      .topbar { align-items: initial; }
      .intro { font-size: 16px; }
      .qr-wrap { min-height: 0; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 20px); }
      .contact-head { padding: 17px; }
      .contact-foot { padding-inline: 17px; }
      .qr-wrap { padding: 15px; }
    }
  </style>
  <style>
    /* Keep QQ and WeChat cards visually identical on desktop. */
    .contact:nth-child(2) { direction: ltr; }
    .contact:nth-child(2) .contact-head,
    .contact:nth-child(2) .contact-foot { grid-column: 1; }
    .contact:nth-child(2) .qr-wrap { grid-column: 2; }
    .contact:nth-child(2) .contact-icon,
    .contact:nth-child(2) .copy { color: var(--accent); }
    .contact:nth-child(2) .contact-icon { background: var(--accent); }
    .contact:nth-child(2) .qr-wrap { background: var(--panel-soft); }
    .contact .copy,
    .contact .copy:hover { color: var(--accent); }
    .contact-foot {
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .contact:nth-child(2) { display: flex; flex-direction: column; }
      .contact:nth-child(2) .contact-head,
      .contact:nth-child(2) .qr-wrap,
      .contact:nth-child(2) .contact-foot { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Sub2API · Account</p>
        <h1>充值与订阅</h1>
        <p class="intro">站点小范围运营，充值请联系站长。</p>
      </div>
    </header>

    <section class="contacts" aria-label="站长联系方式">
      <article class="contact">
        <div class="contact-head">
          <div class="contact-title">
            <div>
              <h2>QQ 联系</h2>
              <div class="account">2052436429</div>
            </div>
          </div>
          <button class="copy" type="button" data-copy="2052436429">复制 QQ</button>
        </div>
        <div class="qr-wrap">
          <img class="qr" src="file:///D:/QQFiles/Tencent%20Files/2052436429/nt_qq/nt_data/Pic/2026-09/Ori/3bba4842a453550d788f349bb3624893.png" alt="QQ 联系二维码">
        </div>
        <div class="contact-foot">备注：站点充值</div>
      </article>

      <article class="contact">
        <div class="contact-head">
          <div class="contact-title">
            <div>
              <h2>微信联系</h2>
              <div class="account">Taokkkkkkkboy</div>
            </div>
          </div>
          <button class="copy" type="button" data-copy="Taokkkkkkkboy">复制微信号</button>
        </div>
        <div class="qr-wrap">
          <img class="qr" src="file:///D:/QQFiles/Tencent%20Files/2052436429/nt_qq/nt_data/Pic/2026-09/Thumb/8bb1717e264a1afb875cbeeebf65520c_720.png" alt="微信联系二维码">
        </div>
        <div class="contact-foot">备注：站点充值</div>
      </article>
    </section>

    <p class="footer">充值到账后可在账户余额中查看变更记录。</p>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    const toast = document.querySelector('.toast')
    let toastTimer

    function showToast(message) {
      toast.textContent = message
      toast.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800)
    }

    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', async () => {
        const value = button.dataset.copy
        try {
          await navigator.clipboard.writeText(value)
          showToast('已复制：' + value)
        } catch {
          showToast('请手动复制：' + value)
        }
      })
    })
  </script>
</body>
</html>
