  <script>
    const rows=[...document.querySelectorAll('.map-row')],toast=document.getElementById('toast');let timer;
    rows.forEach(row=>{
      const meta=row.querySelector('.map-copy small');
      const availability=(meta?.textContent.match(/可用性\s*([\d.]+%)/)||[])[1]||'99.98%';
      row.dataset.availability=availability;
      meta?.remove();
      const number=row.querySelector('.map-number');
      const latencyText=number?.querySelector('strong')?.textContent.trim()||'0 ms';
      const status=number?.querySelector('small');
      const statusText=status?.textContent.trim()||'正常';
      const latency=Number.parseInt(latencyText,10)||0;
      if(number)number.innerHTML=`<span class="map-metric"><strong>${availability}</strong><span>可用性</span></span><span class="map-metric"><strong>${latencyText}</strong><span>延迟</span></span><span class="status-badge${status?.classList.contains('warn')?' warn':''}">${statusText}</span>`;
      row.querySelectorAll('.health-strip').forEach(strip=>{
        const source=[...strip.children].filter(cell=>!cell.classList.contains('current'));
        while(strip.children.length<60){const cell=document.createElement('i');const template=source[(strip.children.length-1)%Math.max(source.length,1)];if(template)cell.className=template.className;strip.insertBefore(cell,strip.lastElementChild)}
        [...strip.children].forEach((cell,index)=>{
          const wasWarn=cell.classList.contains('warn'),wasFail=cell.classList.contains('fail'),wasCurrent=cell.classList.contains('current');
          let tone=wasFail?'red':wasWarn?'yellow':'green';
          if(!wasWarn&&!wasFail&&row.dataset.group==='gemini'&&(index===4||index===5))tone='red';
          const probeLatency=Math.max(1,Math.round(latency*(.86+((index*13)%29)/100)));
          const checkedAt=new Date(Date.now()-(59-index)*5*60*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
          cell.className=`${tone}${wasCurrent?' current':''}`;
          cell.innerHTML=`<span class="probe-tooltip"><strong>${checkedAt}</strong><span>延迟 ${probeLatency} ms</span><span>可用性 ${availability}</span></span>`;
        });
      });
    });
    document.querySelector('.panel-head span').textContent='一行一个分组 · 最近 5 小时';
    document.querySelector('.map-foot > span:last-child').textContent='← 过去 5 小时　现在 →';
    document.getElementById('refresh').addEventListener('click',()=>window.location.reload());
    const page=document.querySelector('.page'),hero=document.querySelector('.hero'),overview=document.querySelector('.overview-grid');
    const viewTabs=document.createElement('div');viewTabs.className='view-tabs';viewTabs.innerHTML='<button class="view-tab active" data-view="groups" type="button">分组状态</button><button class="view-tab" data-view="probes" type="button">探针状态</button>';
    const probeView=document.createElement('section');probeView.className='probe-view';probeView.id='probeView';
    page.insertBefore(viewTabs,hero);page.insertBefore(probeView,hero);
    const probeSamples=[
      [{name:'默认探针',endpoint:'https://api.openai.com/v1/responses',key:'sk-••••••4b2a',status:'operational',latency:142,enabled:true},{name:'备用探针',endpoint:'https://api.openai.com/v1/chat/completions',key:'sk-••••••9c81',status:'operational',latency:159,enabled:true}],
      [{name:'默认探针',endpoint:'https://api.anthropic.com/v1/messages',key:'sk-ant-••••••2d70',status:'degraded',latency:486,enabled:true},{name:'低延迟探针',endpoint:'https://api.anthropic.com/v1/messages',key:'sk-ant-••••••80aa',status:'operational',latency:394,enabled:true}],
      [{name:'默认探针',endpoint:'https://generativelanguage.googleapis.com/v1beta',key:'AIza••••••31f0',status:'operational',latency:168,enabled:true}],
      [{name:'默认探针',endpoint:'https://api.x.ai/v1/responses',key:'xai-••••••7c22',status:'operational',latency:214,enabled:true},{name:'备用探针',endpoint:'https://api.x.ai/v1/chat/completions',key:'xai-••••••1a84',status:'operational',latency:236,enabled:true}],
      [{name:'默认探针',endpoint:'https://api.mistral.ai/v1/chat/completions',key:'mistral-••••••6d8e',status:'operational',latency:236,enabled:true}],
    ];
    const htmlEscape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const statusText=value=>({operational:'正常',degraded:'降级',failed:'失败',error:'错误'}[value]||'未知');
    const statusClass=value=>value==='failed'||value==='error'?'fail':value==='degraded'?'warn':'';
    function renderProbeView(monitors=[]){
      const groups=rows.map((row,index)=>{const monitor=monitors[index];const fallback=probeSamples[index]||[];const probes=monitor?.probes?.length?monitor.probes.map((probe,probeIndex)=>({name:probe.name||`探针 ${probeIndex+1}`,endpoint:probe.endpoint||'未配置接口',key:probe.api_key_masked||'未返回',status:probe.status||'',latency:probe.latency_ms??0,enabled:probe.enabled!==false})):fallback;const title=row.querySelector('.map-copy strong')?.textContent.trim()||`分组 ${index+1}`;return {title,probes}});
      const total=groups.reduce((sum,group)=>sum+group.probes.length,0);const healthy=groups.reduce((sum,group)=>sum+group.probes.filter(probe=>probe.enabled&&(!probe.status||probe.status==='operational')).length,0);
      probeView.innerHTML=`<div class="probe-summary"><div><h2>探针状态</h2><p>管理员可查看每个分组的独立探针、接口和最近一次探测结果</p></div><span class="probe-summary-badge">${healthy} / ${total} 正常</span></div><div class="probe-groups">${groups.map(group=>`<article class="probe-group"><header class="probe-group-head"><div class="probe-group-title"><i class="map-logo logo-openai">${htmlEscape(group.title.slice(0,2).toUpperCase())}</i><div><h3>${htmlEscape(group.title)}</h3><small>探针状态</small></div></div><span class="probe-count">${group.probes.length} 个探针</span></header><div class="probe-list">${group.probes.map((probe,index)=>`<div class="probe-item"><div class="probe-identity"><span class="probe-index">${String(index+1).padStart(2,'0')}</span><span class="probe-name">${htmlEscape(probe.name)}</span></div><div><div class="probe-endpoint" title="${htmlEscape(probe.endpoint)}">${htmlEscape(probe.endpoint)}</div><div class="probe-key">API Key: ${htmlEscape(probe.key)}</div></div><div class="probe-value"><strong>${probe.latency?`${probe.latency} ms`:'—'}</strong><small>延迟</small></div><span class="probe-status ${statusClass(probe.status)}">${statusText(probe.status)}</span><span class="probe-enabled ${probe.enabled?'':'off'}">${probe.enabled?'已启用':'已停用'}</span></div>`).join('')}</div></article>`).join('')}</div>`;
    }
    function setView(view){const isProbe=view==='probes';viewTabs.querySelectorAll('.view-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view===view));hero.hidden=isProbe;overview.hidden=isProbe;probeView.classList.toggle('active',isProbe)}
    viewTabs.addEventListener('click',event=>{const tab=event.target.closest('.view-tab');if(tab)setView(tab.dataset.view)});renderProbeView();
    fetch('/api/v1/channel-monitors',{credentials:'include'}).then(response=>response.ok?response.json():null).then(payload=>{const items=Array.isArray(payload?.items)?payload.items:[];const names=[...new Set(items.map(item=>String(item.group_name||item.name||'').trim()).filter(Boolean))];if(!names.length)return;rows.forEach((row,index)=>{const name=names[index];if(!name)return;const title=row.querySelector('.map-copy strong');if(title)title.textContent=name})}).catch(()=>{});
    fetch('/api/v1/admin/channel-monitors?page=1&page_size=100',{credentials:'include'}).then(response=>response.ok?response.json():null).then(payload=>{const items=Array.isArray(payload?.items)?payload.items:[];if(!items.length)return;rows.forEach((row,index)=>{const name=String(items[index]?.group_name||items[index]?.name||'').trim();if(name){const title=row.querySelector('.map-copy strong');if(title)title.textContent=name}});renderProbeView(items)}).catch(()=>{});
    setTimeout(renderProbeView,500);
  </script>
