name: Custom upstream balance image

on:
  push:
    branches:
      - custom/upstream-balance
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-upstream-balance-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          base_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "name=ghcr.io/$owner/sub2api" >> "$GITHUB_OUTPUT"
          echo "version=$base_version-custom.$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ steps.image.outputs.name }}:custom-upstream-balance
            ${{ steps.image.outputs.name }}:custom-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
