<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">KeepCoding API 注册页面风格稿</title>
  <desc id="desc">包含邮箱验证码流程的桌面端注册页面 UI 预览</desc>
  <rect width="1440" height="1024" fill="#eef5f3"/>
  <rect x="0" y="0" width="510" height="1024" fill="#123f43"/>
  <path d="M0 112H510M0 224H510M0 336H510M0 448H510M0 560H510M0 672H510M0 784H510M0 896H510" stroke="#2d6364" stroke-width="1" opacity="0.34"/>
  <path d="M96 0V1024M192 0V1024M288 0V1024M384 0V1024" stroke="#2d6364" stroke-width="1" opacity="0.2"/>
  <path d="M510 0L400 1024H520L630 0Z" fill="#0b3438" opacity="0.72"/>
  <g transform="translate(72 72)">
    <rect width="48" height="48" rx="12" fill="#d5f36e"/>
    <path d="M14 31L24 17L34 31M18 29H30" fill="none" stroke="#123f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="22" fill="#f2fbf8" font-size="24" font-weight="700" font-family="Inter, Microsoft YaHei, sans-serif">KeepCoding API</text>
    <text x="66" y="43" fill="#a9cfca" font-size="11" letter-spacing="2" font-family="Inter, Microsoft YaHei, sans-serif">API CONVERSION PLATFORM</text>
  </g>
  <g transform="translate(72 280)">
    <text fill="#d5f36e" font-size="14" font-weight="700" letter-spacing="2" font-family="Inter, Microsoft YaHei, sans-serif">SECURE ONBOARDING</text>
    <text y="70" fill="#f2fbf8" font-size="46" font-weight="700" font-family="Inter, Microsoft YaHei, sans-serif">只用可信邮箱，</text>
    <text y="128" fill="#f2fbf8" font-size="46" font-weight="700" font-family="Inter, Microsoft YaHei, sans-serif">开始你的 API 工作流。</text>
    <text y="188" fill="#b9d8d4" font-size="18" font-family="Inter, Microsoft YaHei, sans-serif">注册时验证邮箱，账号从第一步就保持可控。</text>
  </g>
  <g transform="translate(72 590)" font-family="Inter, Microsoft YaHei, sans-serif">
    <g>
      <circle cx="16" cy="16" r="16" fill="#d5f36e"/>
      <path d="M9 16L14 21L24 11" fill="none" stroke="#123f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" fill="#f2fbf8" font-size="17" font-weight="600">仅限 QQ / Gmail 邮箱</text>
    </g>
    <g transform="translate(0 64)">
      <circle cx="16" cy="16" r="16" fill="#d5f36e"/>
      <path d="M9 16L14 21L24 11" fill="none" stroke="#123f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" fill="#f2fbf8" font-size="17" font-weight="600">邮箱验证码确认身份</text>
    </g>
    <g transform="translate(0 128)">
      <circle cx="16" cy="16" r="16" fill="#d5f36e"/>
      <path d="M9 16L14 21L24 11" fill="none" stroke="#123f43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" fill="#f2fbf8" font-size="17" font-weight="600">注册后可随时管理安全设置</text>
    </g>
  </g>
  <text x="72" y="946" fill="#86b6b1" font-size="13" font-family="Inter, Microsoft YaHei, sans-serif">KeepCoding API · 2026</text>

  <rect x="590" y="48" width="778" height="928" rx="18" fill="#f8fcfb" stroke="#d6e5e1" stroke-width="1"/>
  <g transform="translate(650 88)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#6d8282" font-size="15">已有账户？</text>
    <text x="82" fill="#0b7774" font-size="15" font-weight="700">登录</text>
  </g>
  <g transform="translate(690 170)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#173d3d" font-size="34" font-weight="700">创建账户</text>
    <text y="38" fill="#718383" font-size="16">使用受支持的邮箱开始</text>
    <rect y="78" width="560" height="42" rx="21" fill="#e8f5ed"/>
    <circle cx="22" cy="99" r="10" fill="#0b7774"/>
    <path d="M17 99L21 103L28 95" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="104" fill="#276d68" font-size="14" font-weight="600">仅支持 @qq.com、@gmail.com</text>

    <text y="174" fill="#294646" font-size="14" font-weight="700">邮箱地址</text>
    <rect y="190" width="560" height="58" rx="8" fill="#ffffff" stroke="#c9d8d5" stroke-width="1.5"/>
    <rect x="18" y="208" width="22" height="18" rx="3" fill="none" stroke="#79908e" stroke-width="2"/>
    <path d="M19 210L29 218L39 210" fill="none" stroke="#79908e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="226" fill="#99a9a7" font-size="16">name@qq.com</text>

    <text y="298" fill="#294646" font-size="14" font-weight="700">邮箱验证码</text>
    <rect y="314" width="360" height="58" rx="8" fill="#ffffff" stroke="#c9d8d5" stroke-width="1.5"/>
    <text x="20" y="350" fill="#99a9a7" font-size="16">输入 6 位验证码</text>
    <rect x="376" y="314" width="184" height="58" rx="8" fill="#e4f0ed"/>
    <text x="419" y="350" fill="#0b7774" font-size="15" font-weight="700">发送验证码</text>
    <text y="398" fill="#7b8f8d" font-size="13">验证码 10 分钟内有效，发送后可重新获取</text>

    <text y="464" fill="#294646" font-size="14" font-weight="700">设置密码</text>
    <rect y="480" width="560" height="58" rx="8" fill="#ffffff" stroke="#c9d8d5" stroke-width="1.5"/>
    <rect x="19" y="499" width="20" height="19" rx="4" fill="none" stroke="#79908e" stroke-width="2"/>
    <path d="M23 499V494C23 488 35 488 35 494V499" fill="none" stroke="#79908e" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="516" fill="#99a9a7" font-size="16">至少 8 位字符</text>
    <path d="M524 503L541 516M541 503L524 516" fill="none" stroke="#79908e" stroke-width="2" stroke-linecap="round"/>
    <text y="588" fill="#7b8f8d" font-size="13">建议使用字母、数字和符号组合</text>

    <rect y="624" width="20" height="20" rx="4" fill="#0b7774"/>
    <path d="M5 634L9 638L16 630" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="640" fill="#718383" font-size="14">我已阅读并同意服务条款与隐私政策</text>

    <rect y="692" width="560" height="58" rx="8" fill="#0b7774"/>
    <text x="232" y="728" fill="#ffffff" font-size="17" font-weight="700">创建账户</text>
    <path d="M365 721H383M377 713L385 721L377 729" fill="none" stroke="#d5f36e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(690 902)" font-family="Inter, Microsoft YaHei, sans-serif">
    <circle cx="7" cy="7" r="7" fill="#d5f36e"/>
    <path d="M4 7L6 9L10 5" fill="none" stroke="#123f43" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="12" fill="#6d8282" font-size="13">邮箱验证完成后才会创建账号</text>
  </g>
</svg>
