<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">注册页面风格稿 v3</title>
  <desc id="desc">明亮米白、钴蓝和珊瑚橙配色的注册页面预览</desc>
  <rect width="1440" height="1024" fill="#f5f3ee"/>
  <rect x="0" y="0" width="570" height="1024" fill="#e7ebff"/>
  <path d="M0 760L410 0H570V1024H0Z" fill="#d6ddff"/>
  <path d="M0 0H210L0 390Z" fill="#3558d4"/>
  <path d="M0 390L210 0H258L48 390Z" fill="#ff7668"/>
  <g transform="translate(72 70)" font-family="Inter, Microsoft YaHei, sans-serif">
    <rect width="44" height="44" rx="10" fill="#3558d4"/>
    <path d="M12 29L22 15L32 29M16 27H28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="22" fill="#1d2b57" font-size="24" font-weight="700">KeepCoding API</text>
    <text x="60" y="41" fill="#68749a" font-size="10" letter-spacing="2">API CONVERSION PLATFORM</text>
  </g>
  <g transform="translate(72 278)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#3558d4" font-size="14" font-weight="700" letter-spacing="2">WELCOME ABOARD</text>
    <text y="72" fill="#1d2b57" font-size="48" font-weight="700">注册，简单而清楚。</text>
    <text y="132" fill="#1d2b57" font-size="48" font-weight="700">从验证邮箱开始。</text>
    <text y="184" fill="#68749a" font-size="18">只接受 QQ 和 Gmail，账号从第一步就保持干净。</text>
  </g>
  <g transform="translate(72 590)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#68749a" font-size="13" font-weight="700" letter-spacing="1">SUPPORTED EMAIL</text>
    <g transform="translate(0 26)">
      <rect width="150" height="44" rx="22" fill="#ffffff" stroke="#cbd3f7"/>
      <circle cx="24" cy="22" r="7" fill="#ff7668"/>
      <text x="44" y="27" fill="#1d2b57" font-size="15" font-weight="700">QQ 邮箱</text>
    </g>
    <g transform="translate(166 26)">
      <rect width="150" height="44" rx="22" fill="#ffffff" stroke="#cbd3f7"/>
      <circle cx="24" cy="22" r="7" fill="#3558d4"/>
      <text x="44" y="27" fill="#1d2b57" font-size="15" font-weight="700">Gmail</text>
    </g>
    <g transform="translate(0 116)">
      <rect width="370" height="106" rx="12" fill="#ffffff" opacity="0.78"/>
      <circle cx="30" cy="32" r="15" fill="#ff7668"/>
      <path d="M24 32L29 37L38 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="31" fill="#1d2b57" font-size="16" font-weight="700">邮箱验证后才会创建账号</text>
      <text x="60" y="58" fill="#68749a" font-size="14">验证码有效期 10 分钟，安全且可追溯。</text>
    </g>
  </g>
  <text x="72" y="954" fill="#7f8aab" font-size="13" font-family="Inter, Microsoft YaHei, sans-serif">KeepCoding API · 2026</text>

  <rect x="636" y="48" width="720" height="928" rx="12" fill="#ffffff" stroke="#e2e1dc" stroke-width="1"/>
  <g transform="translate(696 92)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#7f8aab" font-size="14">已有账户？</text>
    <text x="78" fill="#3558d4" font-size="14" font-weight="700">登录</text>
    <text x="548" fill="#9aa1b5" font-size="13">01 / 02</text>
    <rect y="50" width="600" height="4" rx="2" fill="#e9ebf4"/>
    <rect y="50" width="300" height="4" rx="2" fill="#3558d4"/>
  </g>
  <g transform="translate(696 190)" font-family="Inter, Microsoft YaHei, sans-serif">
    <text fill="#1d2b57" font-size="34" font-weight="700">创建你的账号</text>
    <text y="38" fill="#7f8aab" font-size="16">先验证邮箱，再设置登录密码</text>

    <text y="106" fill="#34415f" font-size="14" font-weight="700">邮箱地址</text>
    <rect y="122" width="600" height="58" rx="8" fill="#fbfbfd" stroke="#d8dce8" stroke-width="1.5"/>
    <rect x="20" y="141" width="22" height="17" rx="3" fill="none" stroke="#8c95aa" stroke-width="2"/>
    <path d="M21 143L31 150L41 143" fill="none" stroke="#8c95aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="159" fill="#a4aabc" font-size="16">name@qq.com</text>
    <text y="208" fill="#7f8aab" font-size="13">仅支持 @qq.com 和 @gmail.com</text>

    <text y="278" fill="#34415f" font-size="14" font-weight="700">邮箱验证码</text>
    <rect y="294" width="392" height="58" rx="8" fill="#fbfbfd" stroke="#d8dce8" stroke-width="1.5"/>
    <text x="20" y="330" fill="#a4aabc" font-size="16">输入 6 位验证码</text>
    <rect x="412" y="294" width="188" height="58" rx="8" fill="#eef0ff"/>
    <text x="454" y="330" fill="#3558d4" font-size="15" font-weight="700">发送验证码</text>
    <text y="378" fill="#7f8aab" font-size="13">验证码 10 分钟内有效</text>

    <text y="448" fill="#34415f" font-size="14" font-weight="700">设置密码</text>
    <rect y="464" width="600" height="58" rx="8" fill="#fbfbfd" stroke="#d8dce8" stroke-width="1.5"/>
    <rect x="20" y="482" width="20" height="19" rx="4" fill="none" stroke="#8c95aa" stroke-width="2"/>
    <path d="M24 482V477C24 471 36 471 36 477V482" fill="none" stroke="#8c95aa" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="500" fill="#a4aabc" font-size="16">至少 8 位字符</text>
    <path d="M566 486L584 500M584 486L566 500" fill="none" stroke="#8c95aa" stroke-width="2" stroke-linecap="round"/>
    <text y="570" fill="#7f8aab" font-size="13">建议使用字母、数字和符号组合</text>

    <rect y="610" width="20" height="20" rx="4" fill="#3558d4"/>
    <path d="M5 620L9 624L16 616" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="626" fill="#7f8aab" font-size="14">我已阅读并同意服务条款与隐私政策</text>

    <rect y="680" width="600" height="58" rx="8" fill="#ff7668"/>
    <text x="251" y="716" fill="#ffffff" font-size="17" font-weight="700">创建账户</text>
    <path d="M390 709H408M402 701L410 709L402 717" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(696 900)" font-family="Inter, Microsoft YaHei, sans-serif">
    <circle cx="7" cy="7" r="7" fill="#d7e0ff"/>
    <path d="M4 7L6 9L10 5" fill="none" stroke="#3558d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="12" fill="#7f8aab" font-size="13">完成邮箱验证后才会创建账号</text>
  </g>
</svg>
