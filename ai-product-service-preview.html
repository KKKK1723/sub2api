<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 商品服务预览</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #e5e9f0;
      --surface: #ffffff;
      --canvas: #f5f7fb;
      --navy: #172a46;
      --cyan: #1ca6a8;
      --cyan-soft: #e5f7f6;
      --lime: #c7e86d;
      --amber: #f0b35b;
      --shadow: 0 18px 48px rgba(23, 42, 70, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.5 Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .shell { min-height: 100vh; }
    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 72px);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: .01em; }
    .brand-mark {
      width: 32px; height: 32px; display: grid; place-items: center;
      border-radius: 9px; background: var(--navy); color: var(--lime);
      font-size: 13px; letter-spacing: -.08em;
    }
    .top-actions { display: flex; align-items: center; gap: 16px; color: var(--muted); }
    .balance { display: flex; align-items: center; gap: 7px; font-size: 13px; }
    .balance strong { color: var(--ink); font-size: 14px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #e8eef7; color: var(--navy); font-size: 12px; font-weight: 700; }

    .layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; }
    .sidebar { min-height: calc(100vh - 68px); padding: 30px 18px; background: #fbfcfe; border-right: 1px solid var(--line); }
    .side-caption { margin: 0 12px 12px; color: #98a2b3; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .side-link {
      width: 100%; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 9px;
      padding: 11px 12px; margin-bottom: 4px; background: transparent; color: var(--muted); text-align: left; cursor: pointer;
    }
    .side-link:hover { background: #eef3f8; color: var(--ink); }
    .side-link.active { background: var(--navy); color: #fff; box-shadow: 0 8px 18px rgba(23, 42, 70, .16); }
    .side-icon { width: 18px; height: 18px; display: inline-grid; place-items: center; font-size: 15px; }
    .content { min-width: 0; padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 64px) 70px; }
    .content-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    h1 { margin: 0 0 7px; font-size: clamp(26px, 3vw, 36px); line-height: 1.15; letter-spacing: -.025em; }
    .intro { max-width: 580px; margin: 0; color: var(--muted); }
    .contact-chip { display: inline-flex; align-items: center; gap: 9px; padding: 10px 14px; border: 1px solid #cfe6e3; border-radius: 9px; background: var(--cyan-soft); color: #087b7e; font-size: 13px; font-weight: 700; }
    .contact-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px rgba(28,166,168,.12); }
    .hero {
      position: relative; overflow: hidden; min-height: 208px; margin-bottom: 30px; padding: 28px 32px;
      border-radius: 16px; background: linear-gradient(115deg, #142842 0%, #1b4760 52%, #168f92 100%); color: #fff;
      box-shadow: 0 20px 42px rgba(18, 58, 81, .2);
    }
    .hero::before, .hero::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; pointer-events: none; }
    .hero::before { width: 300px; height: 300px; right: -90px; top: -170px; }
    .hero::after { width: 380px; height: 380px; right: -120px; bottom: -290px; }
    .hero-copy { position: relative; z-index: 1; max-width: 530px; }
    .hero-kicker { margin: 0 0 12px; color: var(--lime); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .hero h2 { margin: 0 0 9px; font-size: clamp(23px, 3vw, 32px); line-height: 1.18; letter-spacing: -.02em; }
    .hero p { max-width: 490px; margin: 0; color: rgba(255,255,255,.74); font-size: 14px; }
    .hero-orbit { position: absolute; z-index: 0; right: 13%; top: 50%; width: 128px; height: 128px; border: 1px solid rgba(199,232,109,.45); border-radius: 50%; transform: translateY(-50%); }
    .hero-orbit::before, .hero-orbit::after { content: ""; position: absolute; border-radius: 50%; background: var(--lime); box-shadow: 0 0 24px rgba(199,232,109,.65); }
    .hero-orbit::before { width: 10px; height: 10px; left: 8px; top: 19px; }
    .hero-orbit::after { width: 7px; height: 7px; right: 13px; bottom: 22px; opacity: .7; }
    .category-tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
    .category-tab { position: relative; padding: 0 15px 13px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .category-tab::after { content: ""; position: absolute; right: 14px; bottom: -1px; left: 14px; height: 2px; background: transparent; }
    .category-tab:hover, .category-tab.active { color: var(--navy); font-weight: 700; }
    .category-tab.active::after { background: var(--cyan); }
    .category-label { display: inline-flex; align-items: center; gap: 8px; }
    .provider-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
    .provider-dot.anthropic { background: #d39c75; }
    .provider-dot.grok { background: #6b7280; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 18px; }
    .product-card { display: flex; flex-direction: column; min-height: 300px; padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .product-card:hover { border-color: #b7dedd; transform: translateY(-2px); transition: transform .2s ease, border-color .2s ease; }
    .product-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .product-logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; background: var(--cyan-soft); color: #087b7e; font-weight: 800; }
    .product-logo.pro { background: #edf0ff; color: #5966b3; }
    .product-logo.claude { background: #fff0e6; color: #b96d38; }
    .tag { padding: 4px 8px; border-radius: 5px; background: #f0f9d8; color: #55730d; font-size: 11px; font-weight: 700; }
    .tag.soon { background: #f1f3f6; color: #7b8494; }
    .product-card h2 { margin: 21px 0 8px; font-size: 19px; line-height: 1.25; }
    .product-desc { min-height: 46px; margin: 0; color: var(--muted); font-size: 13px; }
    .meta { display: flex; gap: 7px; flex-wrap: wrap; margin: 17px 0 23px; }
    .meta span { padding: 5px 8px; border-radius: 5px; background: #f6f8fb; color: #647084; font-size: 11px; }
    .product-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: auto; }
    .price { color: var(--navy); font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .price small { color: var(--muted); font-size: 11px; font-weight: 400; }
    .contact-note { color: var(--cyan); font-size: 12px; font-weight: 700; text-align: right; }
    .empty-state { grid-column: 1 / -1; padding: 58px 20px; border: 1px dashed #ccd4df; border-radius: 12px; background: rgba(255,255,255,.6); text-align: center; color: var(--muted); }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 17px; }
    .notice { display: flex; align-items: flex-start; gap: 10px; max-width: 800px; margin-top: 28px; padding: 14px 16px; border-left: 3px solid var(--amber); background: #fffaf1; color: #76562d; font-size: 13px; }
    @media (max-width: 760px) {
      .topbar { height: 60px; padding: 0 18px; }
      .balance { display: none; }
      .layout { display: block; }
      .sidebar { min-height: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; }
      .side-caption { display: none; }
      .side-link { width: auto; display: inline-flex; margin: 0 3px 0 0; padding: 8px 10px; }
      .content { padding: 30px 18px 48px; }
      .content-head { align-items: flex-start; flex-direction: column; margin-bottom: 23px; }
      .contact-chip { align-self: stretch; justify-content: center; }
      .hero { min-height: 220px; padding: 24px; }
      .hero-orbit { right: -24px; top: auto; bottom: -43px; transform: none; }
      .category-tabs { overflow-x: auto; }
      .category-tab { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">AI</span><span>Sub2API</span></div>
      <div class="top-actions"><span class="balance">账户余额 <strong>¥ 128.00</strong></span><span class="avatar">ZL</span></div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="侧边导航">
        <p class="side-caption">服务中心</p>
        <button class="side-link" type="button"><span class="side-icon">⌂</span>控制台</button>
        <button class="side-link active" type="button"><span class="side-icon">▣</span>AI 商品服务</button>
        <button class="side-link" type="button"><span class="side-icon">▤</span>我的订单</button>
        <button class="side-link" type="button"><span class="side-icon">◎</span>账户设置</button>
      </aside>

      <main class="content">
        <div class="content-head">
          <div>
            <h1>AI 商品服务</h1>
            <p class="intro">精选主流 AI 订阅服务，透明展示套餐与价格。</p>
          </div>
          <div class="contact-chip"><span class="contact-dot"></span>需要购买？联系站长</div>
        </div>

        <section class="hero" aria-label="AI 服务宣传">
          <div class="hero-copy">
            <p class="hero-kicker">AI SUBSCRIPTION SERVICE</p>
            <h2>把更多时间，留给真正重要的创造。</h2>
            <p>GPT、Claude 等专业 AI 服务持续上新。页面仅作商品介绍，如有需要，请联系站长购买。</p>
          </div>
          <div class="hero-orbit" aria-hidden="true"></div>
        </section>

        <div class="category-tabs" role="tablist" aria-label="AI 服务商分类">
          <button class="category-tab active" type="button" role="tab" aria-selected="true" data-category="openai"><span class="category-label"><span class="provider-dot"></span>OpenAI</span></button>
          <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="anthropic"><span class="category-label"><span class="provider-dot anthropic"></span>Anthropic</span></button>
          <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="grok"><span class="category-label"><span class="provider-dot grok"></span>Grok</span></button>
        </div>

        <section class="product-grid" id="productGrid" aria-live="polite"></section>
        <div class="notice"><span>ⓘ</span><span>商品页面仅用于服务介绍，不提供在线下单。商品含质保订阅：如账号订阅掉订，按剩余天数补差价；账号封号风险不在质保范围内。如有需要，请联系站长购买。</span></div>
      </main>
    </div>
  </div>
  <script type="application/json" hidden>
    const 商品 = {
      openai: [
        { 名称: 'GPT Plus 代充', 描述: '适用于 ChatGPT Plus，享受 GPT-5、语音和图像等完整功能。', 价格: '¥ 148', 周期: '/ 月', 标签: ['GPT-5', '优先访问'], 图标: 'GPT', 图标类: '' },
        { 名称: 'GPT Pro 5x 代充', 描述: '适用于 ChatGPT Pro 5x，满足高频专业用户的更高额度需求。', 价格: '¥ 1,080', 周期: '/ 月', 标签: ['Pro 5x', '高额度'], 图标: '5x', 图标类: 'pro' }
      ],
      anthropic: [],
      grok: []
    };

    const 服务商名称 = { openai: 'OpenAI', anthropic: 'Anthropic', grok: 'Grok' };
    const productGrid = document.getElementById('productGrid');
    const cartCount = document.getElementById('cartCount');
    const toast = document.getElementById('toast');
    let 购物车数量 = 0;
    let 提示定时器;

    function 显示商品(分类) {
      const 商品列表 = 商品[分类];
      if (!商品列表.length) {
        productGrid.innerHTML = '<div class="empty-state"><strong>' + 服务商名称[分类] + ' 商品即将上架</strong><span>我们正在准备稳定可靠的订阅服务，敬请关注。</span></div>';
        return;
      }
      productGrid.innerHTML = 商品列表.map((商品项) => `
        <article class="product-card">
          <div class="product-top"><div class="product-logo ${商品项.图标类}">${商品项.图标}</div><span class="tag">可购买</span></div>
          <h2>${商品项.名称}</h2>
          <p class="product-desc">${商品项.描述}</p>
          <div class="meta">${商品项.标签.map((标签) => `<span>${标签}</span>`).join('')}</div>
          <div class="product-bottom"><div class="price">${商品项.价格} <small>${商品项.周期}</small></div><button class="buy-button" type="button" data-product="${商品项.名称}">立即购买</button></div>
        </article>
      `).join('');
      productGrid.querySelectorAll('.buy-button').forEach((按钮) => {
        按钮.addEventListener('click', () => {
          购物车数量 += 1;
          cartCount.textContent = String(购物车数量);
          显示提示('已将「' + 按钮.dataset.product + '」加入购物车');
        });
      });
    }

    function 显示提示(内容) {
      toast.textContent = 内容;
      toast.classList.add('show');
      clearTimeout(提示定时器);
      提示定时器 = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    document.querySelectorAll('.category-tab').forEach((标签按钮) => {
      标签按钮.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach((按钮) => {
          const 当前按钮 = 按钮 === 标签按钮;
          按钮.classList.toggle('active', 当前按钮);
          按钮.setAttribute('aria-selected', String(当前按钮));
        });
        显示商品(标签按钮.dataset.category);
      });
    });

    document.getElementById('cartButton').addEventListener('click', () => {
      显示提示(购物车数量 ? '购物车中有 ' + 购物车数量 + ' 件商品' : '购物车还是空的');
    });
    显示商品('openai');
  </script>
  <script>
    (() => {
      const 商品分组 = {
        openai: [
          { 名称: 'GPT Plus', 描述: '适用于 ChatGPT Plus，体验更强模型、语音与图像能力。含质保订阅，掉订按剩余天数补差价，不质保封号。', 价格: '¥ 128', 标签: ['GPT Plus', '月度订阅', '含质保'], 图标: 'GPT', 样式: '' },
          { 名称: 'GPT Pro 5x', 描述: '适用于高频专业用户，提供更高额度与更稳定的使用体验。含质保订阅，掉订按剩余天数补差价，不质保封号。', 价格: '¥ 688', 标签: ['Pro 5x', '高额度', '含质保'], 图标: '5x', 样式: 'pro' }
        ],
        anthropic: [
          { 名称: 'Claude Pro', 描述: '适用于 Claude Pro，支持更长上下文与更高使用额度。含质保订阅，掉订按剩余天数补差价，不质保封号。', 价格: '¥ 138', 标签: ['Claude Pro', '月度订阅', '含质保'], 图标: 'C', 样式: 'claude' }
        ],
        grok: []
      };
      const 服务商 = { openai: 'OpenAI', anthropic: 'Anthropic', grok: 'Grok' };
      const 网格 = document.getElementById('productGrid');
      function 渲染(分类) {
        const 列表 = 商品分组[分类];
        if (!列表.length) {
          网格.innerHTML = '<div class="empty-state"><strong>' + 服务商[分类] + ' 商品即将上架</strong><span>我们正在准备稳定可靠的订阅服务，敬请关注。</span></div>';
          return;
        }
        网格.innerHTML = 列表.map((商品) => `
          <article class="product-card">
            <div class="product-top"><div class="product-logo ${商品.样式}">${商品.图标}</div><span class="tag">服务介绍</span></div>
            <h2>${商品.名称}</h2>
            <p class="product-desc">${商品.描述}</p>
            <div class="meta">${商品.标签.map((标签) => `<span>${标签}</span>`).join('')}</div>
            <div class="product-bottom"><div class="price">${商品.价格} <small>/ 月</small></div><div class="contact-note">如有需要<br>请联系站长购买</div></div>
          </article>
        `).join('');
      }
      document.querySelectorAll('.category-tab').forEach((按钮) => {
        按钮.addEventListener('click', () => {
          document.querySelectorAll('.category-tab').forEach((项目) => {
            const 当前 = 项目 === 按钮;
            项目.classList.toggle('active', 当前);
            项目.setAttribute('aria-selected', String(当前));
          });
          渲染(按钮.dataset.category);
        });
      });
      渲染('openai');
    })();
  </script>
</body>
</html>
